# Local development database. Keep the password in DB_PASSWORD, never in Git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.username=${DB_USERNAME:ecom_app}
spring.datasource.password=${DB_PASSWORD}

# Convenient for local development; use migrations and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
